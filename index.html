<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI MCQ Master</title>

    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            margin-bottom: 10px;
        }

        .welcome p {
            color: #666;
            margin-bottom: 25px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        button {
            border: none;
            padding: 16px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #imageInput {
            display: none;
        }

        #previewBox {
            display: none;
            margin-top: 25px;
        }

        #previewImage {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .selectedText {
            margin-bottom: 12px;
            font-weight: bold;
        }

        #ocrResult {
            margin-top: 25px;
            text-align: left;
        }

        #ocrText {
            width: 100%;
            min-height: 300px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background: #f0f4ff;
            border-radius: 8px;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
            font-size: 14px;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>AI MCQ Master</h1>

        <p>Automatic MCQ Exam System</p>

    </div>


    <div class="container">

        <div class="welcome">

            <h2>স্বাগতম 👋</h2>

            <p>
                বইয়ের ছবি থেকে বাংলা ও English লেখা পড়ুন।
            </p>


            <!-- Image input -->

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >


            <!-- Main buttons -->

            <div class="buttons">

                <button onclick="openImagePicker()">
                    📷 ছবি থেকে MCQ
                </button>

                <button>
                    📄 PDF থেকে MCQ
                </button>

                <button>
                    📝 প্রশ্ন ব্যাংক
                </button>

                <button>
                    🎯 পরীক্ষা শুরু
                </button>

            </div>


            <!-- Status -->

            <div id="status" class="status">
                প্রস্তুত
            </div>


            <!-- Preview -->

            <div id="previewBox">

                <div class="selectedText">
                    📷 নির্বাচিত ছবি
                </div>

                <img
                    id="previewImage"
                    alt="Selected image"
                >

                <br><br>


                <button onclick="runOCR()">
                    🔍 বাংলা + English OCR
                </button>

            </div>


            <!-- OCR result -->

            <div id="ocrResult">

                <h3>📄 OCR থেকে পাওয়া লেখা</h3>

                <textarea
                    id="ocrText"
                    placeholder="OCR করার পর এখানে বাংলা ও English লেখা দেখা যাবে..."
                    readonly
                ></textarea>

            </div>


        </div>


        <div class="footer">

            AI MCQ Master © 2026

        </div>

    </div>



    <script>


        // Open Gallery

        function openImagePicker() {

            document
                .getElementById("imageInput")
                .click();

        }



        // When image is selected

        document
            .getElementById("imageInput")
            .addEventListener("change", function(event) {


                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                const imageURL =
                    URL.createObjectURL(file);


                document
                    .getElementById("previewImage")
                    .src = imageURL;


                document
                    .getElementById("previewBox")
                    .style.display = "block";


                document
                    .getElementById("status")
                    .style.display = "block";


                document
                    .getElementById("status")
                    .innerText =
                    "✅ ছবি নির্বাচন করা হয়েছে।";


            });



        // OCR

        async function runOCR() {


            const file =
                document
                    .getElementById("imageInput")
                    .files[0];


            if (!file) {

                alert(
                    "আগে একটি ছবি নির্বাচন করুন।"
                );

                return;

            }


            const status =
                document
                    .getElementById("status");


            const ocrText =
                document
                    .getElementById("ocrText");


            status.style.display = "block";

            status.innerText =
                "⏳ বাংলা OCR-এর language data প্রস্তুত হচ্ছে...";


            ocrText.value = "";



            try {


                /*
                 * বাংলা + English OCR
                 *
                 * ben = Bengali
                 * eng = English
                 */

                const result =
                    await Tesseract.recognize(

                        file,

                        "ben+eng",

                        {

                            logger: function(info) {


                                if (
                                    info.status ===
                                    "recognizing text"
                                ) {


                                    const progress =
                                        Math.round(
                                            info.progress * 100
                                        );


                                    status.innerText =
                                        "⏳ OCR চলছে: "
                                        + progress
                                        + "%";

                                }

                            }

                        }

                    );



                ocrText.value =
                    result.data.text;


                status.innerText =
                    "✅ বাংলা + English OCR সম্পন্ন হয়েছে।";


            }


            catch (error) {


                console.error(error);


                status.innerText =
                    "❌ OCR করতে সমস্যা হয়েছে।";


                ocrText.value =
                    "OCR করা যায়নি। আবার চেষ্টা করুন।";

            }


        }


    </script>


</body>

</html>
